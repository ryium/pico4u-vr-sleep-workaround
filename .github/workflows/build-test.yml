name: Build and Bundle Test
on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  test-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2

      - name: setup adb
        run: .\scripts\setup_adb.ps1

      - name: bundle tauri app
        run: cargo fmt --check && cargo test --locked && cargo clippy --locked -- -D warnings

      - name: build installers
        run: pnpm tauri build --no-sign

      - name: verify bundled adb
        shell: pwsh
        run: |
          # Find the generated installer
          $installer = Get-ChildItem "target/release/bundle/nsis/*_x64-setup.exe" -ErrorAction Stop | Select-Object -First 1
          Write-Host "Found installer: $($installer.FullName)"
          
          # Extract the installer to a temporary directory
          Write-Host "Extracting installer..."
          7z x $($installer.FullName) -oextracted_app
          
          # 1. Verify DLLs are present (Searching recursively because NSIS often extracts to subdirs like $_OUTDIR)
          Write-Host "Verifying DLL presence..."
          $required_dlls = @("AdbWinApi.dll", "AdbWinUsbApi.dll")
          foreach ($dll in $required_dlls) {
              $found = Get-ChildItem "extracted_app" -Filter $dll -Recurse | Select-Object -First 1
              if ($found) {
                  Write-Host "✓ $dll found at: $($found.FullName)"
              } else {
                  throw "ERROR: $dll not found in the extracted application!"
              }
          }
          
          # 2. Verify ADB sidecar can execute
          Write-Host "Verifying ADB execution..."
          $adb_exe = Get-ChildItem "extracted_app" -Filter "*adb*" -Recurse | Where-Object { $_.Name -like "*.exe" } | Select-Object -First 1
          
          if ($null -eq $adb_exe) {
              Write-Host "ERROR: ADB executable not found! Listing all files in extracted_app for debugging:"
              Get-ChildItem "extracted_app" -Recurse | Select-Object FullName
              throw "ERROR: ADB executable not found in the extracted application!"
          }
          
          Write-Host "Found sidecar at: $($adb_exe.FullName)"
          
          # Run adb version. If DLLs are missing, this will fail.
          & $adb_exe.FullName version
          if ($LASTEXITCODE -ne 0) {
              throw "ERROR: Bundled ADB failed to execute! This usually means required DLLs are missing or inaccessible."
          }
          Write-Host "✓ ADB executed successfully!"
