name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2

      - name: configure fxc for gpui
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($fxc) {
              Write-Host "Found fxc.exe at: $($fxc.FullName)"
              "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: setup adb
        run: .\scripts\setup_adb.ps1

      - name: get release version
        id: get_version
        shell: bash
        run: |
          VERSION=$GITHUB_REF_NAME
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION="v__VERSION__"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: build release binary
        run: cargo build --release --locked

      - name: package release archive
        shell: pwsh
        run: |
          $staging = "target/release/package/pico4u-vr-sleep-workaround"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "target/release/pico4u-vr-sleep-workaround.exe" $staging -Force
          Copy-Item "bin/adb.exe" $staging -Force
          Copy-Item "bin/AdbWinApi.dll" $staging -Force
          Copy-Item "bin/AdbWinUsbApi.dll" $staging -Force
          Copy-Item "LICENSE" $staging -Force
          Copy-Item "LICENSES" (Join-Path $staging "LICENSES") -Recurse -Force

          $archive = "target/release/pico4u-vr-sleep-workaround-$($env:VERSION)-windows-x64.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $archive -Force
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: publish github release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS="--generate-notes --title \"pico4u-vr-sleep-workaround ${{ env.VERSION }}\""
          if [[ "${{ github.ref_name }}" == *"-"* ]]; then
            gh release create "${{ github.ref_name }}" "${{ env.ARCHIVE_PATH }}" --generate-notes --title "pico4u-vr-sleep-workaround ${{ env.VERSION }}" --draft --prerelease
          else
            gh release create "${{ github.ref_name }}" "${{ env.ARCHIVE_PATH }}" --generate-notes --title "pico4u-vr-sleep-workaround ${{ env.VERSION }}"
          fi
